[databases]
battle_royale = host=127.0.0.1 port=5432 dbname=battle_royale

[pgbouncer]
; Listen on port 6432 (app connects here instead of 5432)
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling — best for web apps with short queries
pool_mode = transaction

; Pool sizing for ~300 concurrent users
; Each user request holds a connection only during the query (~1-5ms)
; 25 server connections can easily serve 300+ concurrent users
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Connection limits
max_client_conn = 400
max_db_connections = 30

; Timeouts
server_idle_timeout = 300
client_idle_timeout = 600
query_timeout = 30
query_wait_timeout = 10

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
